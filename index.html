<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bush Runner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c2615">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Run through the bush, jump over logs, rocks and thorns. The longer you run, the faster it gets.">
<style>
:root{--bg:#1c2615;--ink:#f4ecd0;--muted:#b9c08f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
h1{margin:0;font-size:1.4rem;font-weight:700;letter-spacing:.02em}
canvas{width:100%;max-width:900px;aspect-ratio:2/1;border-radius:14px;background:#6fa8bd;display:block;cursor:pointer}
p{margin:0;color:var(--muted);font-size:.95rem;text-align:center;max-width:46ch;line-height:1.5}
kbd{background:#2d3a22;border:1px solid #475a35;border-radius:5px;padding:1px 7px;font:inherit;color:var(--ink)}
button{margin-top:2px;background:#2d3a22;color:var(--ink);border:1px solid #475a35;border-radius:8px;padding:7px 16px;font:inherit;font-size:.95rem;cursor:pointer}
button:hover{background:#3a4a2c}
button:focus-visible{outline:2px solid #f2b73c;outline-offset:2px}
</style>
</head>
<body>
<h1>Bush Runner</h1>
<canvas id="game" aria-label="Bush Runner game. Press space or tap to jump."></canvas>
<p>Press <kbd>Space</kbd> or <kbd>&uarr;</kbd>, or tap the screen, to jump. Clear every obstacle and your speed keeps climbing.</p>
<button id="mute" type="button">Sound: on</button>
<p id="offline" hidden>Ready to play offline</p>
<script>
(() => {
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  const W = 900, H = 450, GROUND = 370;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);

  const GRAV = 2300, JUMP = 800, START = 320, MAXV = 850, ACCEL = 9;
  const TYPES = [
    { n: 'log', w: 64, h: 30 }, { n: 'rock', w: 46, h: 38 },
    { n: 'thorn bush', w: 54, h: 54 }, { n: 'termite mound', w: 40, h: 62 }
  ];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const FONT = '"Avenir Next","Segoe UI",system-ui,sans-serif';

  let state = 'ready', speed = START, dist = 0, off = 0, gapLeft = 0, overAt = 0, hit = '', best = 0, obstacles = [];
  const player = { x: 120, y: GROUND, vy: 0, w: 34, h: 56 };
  try { best = +localStorage.getItem('bushRunnerBest') || 0; } catch (e) {}

  const bushes = Array.from({ length: 9 }, (_, i) => ({ x: i * 135 + rnd(0, 60), r: rnd(26, 44), c: i % 2 ? '#4b6a2f' : '#587a35' }));
  const trees = [0, 1, 2].map(i => ({ x: i * 520 + rnd(0, 160), h: rnd(70, 100) }));
  const pebbles = Array.from({ length: 25 }, (_, i) => ({ x: i * 50 + rnd(0, 30), y: GROUND + rnd(24, H - GROUND - 8), r: rnd(1.5, 3.5) }));
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
  sky.addColorStop(0, '#6fa8bd'); sky.addColorStop(1, '#f3d68e');

  const score = () => Math.floor(dist / 10);

  let ac = null, muted = false, lastStep = 0, lastMile = 0;
  try { muted = localStorage.getItem('bushRunnerMuted') === '1'; } catch (e) {}
  const mb = document.getElementById('mute');
  function setMuted(m) {
    muted = m; mb.textContent = m ? 'Sound: off' : 'Sound: on';
    try { localStorage.setItem('bushRunnerMuted', m ? '1' : '0'); } catch (e) {}
  }
  setMuted(muted);
  mb.addEventListener('pointerdown', e => e.stopPropagation());
  mb.addEventListener('click', () => { setMuted(!muted); mb.blur(); });

  function audio() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f0, f1, dur, type, vol, delay = 0) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, cutoff) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  const sfx = {
    start: () => tone(440, 880, 0.2, 'triangle', 0.1),
    jump: () => tone(330, 760, 0.18, 'square', 0.07),
    land: () => noise(0.09, 0.22, 500),
    step: () => noise(0.035, 0.07, 900),
    mile: () => { tone(660, 660, 0.1, 'triangle', 0.12); tone(990, 990, 0.16, 'triangle', 0.12, 0.1); },
    crash: () => { noise(0.5, 0.35, 1400); tone(240, 50, 0.5, 'sawtooth', 0.14); }
  };

  function reset() {
    speed = START; dist = 0; obstacles = []; gapLeft = 500;
    player.y = GROUND; player.vy = 0; lastStep = 0; lastMile = 0; state = 'running'; sfx.start();
  }
  function gameOver(name) {
    state = 'over'; hit = name; overAt = performance.now(); sfx.crash();
    if (score() > best) {
      best = score();
      try { localStorage.setItem('bushRunnerBest', best); } catch (e) {}
    }
  }
  function act() {
    audio();
    if (state === 'ready') reset();
    else if (state === 'over') { if (performance.now() - overAt > 400) reset(); }
    else if (player.y >= GROUND) { player.vy = -JUMP; sfx.jump(); }
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyM') { setMuted(!muted); return; }
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) act(); }
  });
  document.addEventListener('pointerdown', act);

  function spawn() {
    const t = TYPES[Math.floor(Math.random() * TYPES.length)];
    obstacles.push({ ...t, x: W + 40 });
    gapLeft = t.w + speed * (0.85 + Math.random() * 0.85);
  }

  function update(dt) {
    if (state !== 'running') { if (state === 'ready') off += 40 * dt; return; }
    speed = Math.min(MAXV, speed + ACCEL * dt);
    dist += speed * dt; off += speed * dt;
    const wasAir = player.y < GROUND;
    player.vy += GRAV * dt; player.y += player.vy * dt;
    if (player.y >= GROUND) { player.y = GROUND; player.vy = 0; if (wasAir) sfx.land(); }
    const step = Math.floor(dist / 22 / Math.PI);
    if (step !== lastStep) { lastStep = step; if (player.y >= GROUND) sfx.step(); }
    const mile = Math.floor(score() / 100);
    if (mile > lastMile) { lastMile = mile; sfx.mile(); }
    gapLeft -= speed * dt;
    if (gapLeft <= 0) spawn();
    obstacles.forEach(o => o.x -= speed * dt);
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    const p = { l: player.x + 7, r: player.x + player.w - 7, t: player.y - player.h + 8, b: player.y };
    for (const o of obstacles) {
      const b = { l: o.x + 6, r: o.x + o.w - 6, t: GROUND - o.h + 6, b: GROUND };
      if (p.r > b.l && p.l < b.r && p.b > b.t && p.t < b.b) { gameOver(o.n); break; }
    }
  }

  function tile(items, period, f, fn) {
    const o = (off * f) % period;
    for (const it of items) for (let k = 0; k <= 1; k++) {
      const x = it.x - o + k * period;
      if (x > -120 && x < W + 120) fn(it, x);
    }
  }

  function drawScene() {
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,241,184,.28)'; ctx.beginPath(); ctx.arc(700, 92, 62, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff1b8'; ctx.beginPath(); ctx.arc(700, 92, 38, 0, 7); ctx.fill();

    const hills = (base, amp, f, col) => {
      const o = off * f;
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GROUND);
      for (let x = 0; x <= W; x += 12) {
        const u = x + o;
        ctx.lineTo(x, base + amp * Math.sin(u / 140) + amp * .6 * Math.sin(u / 53));
      }
      ctx.lineTo(W, GROUND); ctx.fill();
    };
    hills(255, 22, .04, '#a6b26f');
    hills(290, 16, .08, '#8a9a5b');

    tile(trees, 1560, .18, (t, x) => {
      const by = GROUND - 22;
      ctx.strokeStyle = '#4a4030'; ctx.lineWidth = 5; ctx.beginPath();
      ctx.moveTo(x, by); ctx.lineTo(x + 3, by - t.h); ctx.stroke();
      ctx.fillStyle = '#6f7f45';
      ctx.beginPath(); ctx.ellipse(x + 3, by - t.h, 64, 15, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x - 16, by - t.h - 11, 36, 10, 0, 0, 7); ctx.fill();
    });
    tile(bushes, 1215, .38, (b, x) => {
      ctx.fillStyle = b.c;
      [[0, 0, 1], [-b.r * .8, 6, .75], [b.r * .8, 6, .8]].forEach(([dx, dy, s]) => {
        ctx.beginPath(); ctx.arc(x + dx, GROUND - b.r * s + dy, b.r * s, 0, 7); ctx.fill();
      });
    });

    ctx.fillStyle = '#a67c4a'; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#6f8f3a'; ctx.fillRect(0, GROUND, W, 12);
    for (let x = -(off % 40); x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, GROUND + 4); ctx.lineTo(x + 5, GROUND - 9);
      ctx.lineTo(x + 10, GROUND + 4); ctx.lineTo(x + 15, GROUND - 6); ctx.lineTo(x + 20, GROUND + 4); ctx.fill();
    }
    ctx.fillStyle = '#85612f';
    tile(pebbles, 1250, 1, (p, x) => { ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, 7); ctx.fill(); });
  }

  function drawObstacle(o) {
    const { x, w, h } = o, y = GROUND - h;
    if (o.n === 'log') {
      ctx.fillStyle = '#7a5230'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill();
      ctx.fillStyle = '#c99a62'; ctx.beginPath(); ctx.ellipse(x + w - 7, y + h / 2, 7, h / 2 - 3, 0, 0, 7); ctx.fill();
      ctx.strokeStyle = '#5a3a20'; ctx.lineWidth = 2;
      [10, 20].forEach(d => { ctx.beginPath(); ctx.moveTo(x + 8, y + d); ctx.lineTo(x + w - 20, y + d); ctx.stroke(); });
    } else if (o.n === 'rock') {
      ctx.fillStyle = '#8c8b84'; ctx.beginPath();
      ctx.moveTo(x, GROUND); ctx.lineTo(x + 6, y + 14); ctx.lineTo(x + 20, y); ctx.lineTo(x + 36, y + 6);
      ctx.lineTo(x + w, GROUND); ctx.fill();
      ctx.fillStyle = '#a9a8a0'; ctx.beginPath();
      ctx.moveTo(x + 20, y); ctx.lineTo(x + 36, y + 6); ctx.lineTo(x + 26, y + 18); ctx.fill();
    } else if (o.n === 'thorn bush') {
      ctx.fillStyle = '#2f4a22'; ctx.beginPath(); ctx.ellipse(x + w / 2, GROUND - 20, w / 2, 20, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#d9d2a0';
      for (let i = 0; i < 7; i++) {
        const sx = x + 6 + i * 7.5, sy = GROUND - 30 - Math.sin(i * 1.7) * 9 - 6;
        ctx.beginPath(); ctx.moveTo(sx - 3, sy + 10); ctx.lineTo(sx, sy - 12 + (i % 2) * 6); ctx.lineTo(sx + 3, sy + 10); ctx.fill();
      }
    } else {
      ctx.fillStyle = '#9a5f3a'; ctx.beginPath();
      ctx.moveTo(x, GROUND); ctx.lineTo(x + 9, y + 18); ctx.lineTo(x + w / 2, y);
      ctx.lineTo(x + w - 9, y + 18); ctx.lineTo(x + w, GROUND); ctx.fill();
      ctx.strokeStyle = '#6e4226'; ctx.lineWidth = 2;
      [[.35, .5], [.6, .7], [.45, .85]].forEach(([a, b]) => {
        ctx.beginPath(); ctx.moveTo(x + w * a - 6, y + h * b); ctx.lineTo(x + w * a + 6, y + h * b); ctx.stroke();
      });
    }
  }

  function drawPlayer() {
    const p = player, air = p.y < GROUND, cx = p.x + p.w / 2;
    const ph = state === 'running' ? dist / 22 : 0;
    const lift = Math.min(1, (GROUND - p.y) / 120);
    ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.beginPath();
    ctx.ellipse(cx, GROUND + 5, 20 - lift * 8, 5 - lift * 2, 0, 0, 7); ctx.fill();
    ctx.lineCap = 'round'; ctx.lineWidth = 8; ctx.strokeStyle = '#2d2a26';
    for (let i = 0; i < 2; i++) {
      const s = air ? (i ? 1 : -1) * .8 : Math.sin(ph + i * Math.PI);
      const fy = p.y - (air ? 10 : Math.max(0, Math.cos(ph + i * Math.PI)) * 9);
      ctx.beginPath(); ctx.moveTo(cx, p.y - 24); ctx.lineTo(cx + s * 16, fy); ctx.stroke();
    }
    ctx.fillStyle = '#d4482f'; ctx.beginPath(); ctx.roundRect(cx - 13, p.y - 54, 26, 34, 8); ctx.fill();
    ctx.strokeStyle = '#7a4a2b'; ctx.lineWidth = 6;
    const arm = air ? -1 : Math.sin(ph + Math.PI);
    ctx.beginPath(); ctx.moveTo(cx, p.y - 46); ctx.lineTo(cx + arm * 14 - 2, p.y - 32 - (air ? 12 : 0)); ctx.stroke();
    ctx.fillStyle = '#7a4a2b'; ctx.beginPath(); ctx.arc(cx + 3, p.y - 63, 10, 0, 7); ctx.fill();
    ctx.fillStyle = '#f2b73c'; ctx.fillRect(cx - 7, p.y - 71, 20, 5);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + 8, p.y - 64, 1.8, 0, 7); ctx.fill();
  }

  function drawHUD() {
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = 'rgba(28,38,21,.55)'; ctx.beginPath(); ctx.roundRect(16, 16, W - 32, 40, 10); ctx.fill();
    ctx.fillStyle = '#f4ecd0'; ctx.font = `700 20px ${FONT}`;
    ctx.textAlign = 'left'; ctx.fillText(`${score()} m`, 32, 43);
    ctx.textAlign = 'center'; ctx.fillText(`Speed ${(speed / START).toFixed(1)}x`, W / 2, 43);
    ctx.textAlign = 'right'; ctx.fillText(`Best ${best} m`, W - 32, 43);
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(28,38,21,.58)'; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.fillStyle = '#f4ecd0';
    ctx.font = `700 46px ${FONT}`; ctx.fillText(title, W / 2, 190);
    ctx.font = `400 21px ${FONT}`;
    lines.forEach((l, i) => ctx.fillText(l, W / 2, 232 + i * 32));
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    drawScene(); obstacles.forEach(drawObstacle); drawPlayer(); drawHUD();
    if (state === 'ready') overlay('Bush Runner', ['Jump over logs, rocks, thorns and termite mounds.', 'Tap or press Space to start']);
    if (state === 'over') overlay(`You hit a ${hit}`, [`Distance ${score()} m  ·  Best ${best} m`, 'Tap or press Space to run again']);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.ready.then(() => { document.getElementById('offline').hidden = false; });
  });
}
</script>
</body>
</html>
