<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bush Runner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c2615">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="Run through the bush, jump over logs, rocks and thorns. The longer you run, the faster it gets.">
<style>
:root{--bg:#1c2615;--ink:#f4ecd0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;left:0;top:0;display:block;background:#6fa8bd;cursor:pointer}
button{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));background:rgba(28,38,21,.72);color:var(--ink);border:1px solid #475a35;border-radius:8px;padding:8px 14px;font:inherit;font-size:.9rem;cursor:pointer;touch-action:manipulation}
button:hover{background:rgba(58,74,44,.85)}
button:focus-visible{outline:2px solid #f2b73c;outline-offset:2px}
#offline{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);margin:0;background:rgba(28,38,21,.8);padding:6px 14px;border-radius:999px;font-size:.85rem;pointer-events:none}
#safe{position:fixed;inset:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);visibility:hidden;pointer-events:none}
</style>
</head>
<body>
<canvas id="game" aria-label="Bush Runner game. Press space or tap to jump."></canvas>
<button id="mute" type="button">Sound: on</button>
<p id="offline" hidden>Ready to play offline</p>
<div id="safe"></div>
<script>
(() => {
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  const safeEl = document.getElementById('safe');
  let W = 900, H = 450, GROUND = 370, K = 1, sky, inset = { t: 0, r: 0, b: 0, l: 0 };

  const GRAV = 2300, JUMP = 800, START = 320, MAXV = 850, ACCEL = 9;
  const TYPES = [
    { n: 'log', w: 64, h: 30 }, { n: 'rock', w: 46, h: 38 },
    { n: 'thorn bush', w: 54, h: 54 }, { n: 'termite mound', w: 40, h: 62 }
  ];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const FONT = '"Avenir Next","Segoe UI",system-ui,sans-serif';

  let state = 'ready', speed = START, dist = 0, off = 0, gapLeft = 0, overAt = 0, hit = '', best = 0, obstacles = [];
  const player = { x: 120, y: GROUND, vy: 0, w: 34, h: 56 };
  try { best = +localStorage.getItem('bushRunnerBest') || 0; } catch (e) {}

  const bushes = Array.from({ length: 9 }, (_, i) => ({ x: i * 135 + rnd(0, 60), r: rnd(26, 44), c: i % 2 ? '#3f7a3a' : '#4c8c3f', f: i % 3 ? '#f7a8c4' : '#ffd84d' }));
  const trees = [0, 1, 2].map(i => ({ x: i * 520 + rnd(0, 160), h: rnd(70, 100) }));
  const clouds = Array.from({ length: 5 }, (_, i) => ({ x: i * 300 + rnd(0, 120), fy: rnd(0.1, 0.4), s: rnd(0.8, 1.4) }));
  const pebbles = Array.from({ length: 25 }, (_, i) => ({ x: i * 50 + rnd(0, 30), fy: rnd(0.18, 0.92), r: rnd(1.5, 3.5) }));

  const score = () => Math.floor(dist / 10);

  let ac = null, muted = false, lastStep = 0, lastMile = 0;
  try { muted = localStorage.getItem('bushRunnerMuted') === '1'; } catch (e) {}
  const mb = document.getElementById('mute');
  function setMuted(m) {
    muted = m; mb.textContent = m ? 'Sound: off' : 'Sound: on';
    try { localStorage.setItem('bushRunnerMuted', m ? '1' : '0'); } catch (e) {}
  }
  setMuted(muted);
  mb.addEventListener('pointerdown', e => e.stopPropagation());
  mb.addEventListener('click', () => { setMuted(!muted); mb.blur(); });

  function audio() {
    if (!ac) { const C = window.AudioContext || window.webkitAudioContext; if (C) ac = new C(); }
    if (ac && ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f0, f1, dur, type, vol, delay = 0) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, cutoff) {
    if (muted) return;
    const a = audio(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = cutoff; g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(a.destination); s.start();
  }
  const sfx = {
    start: () => tone(440, 880, 0.2, 'triangle', 0.1),
    jump: () => tone(330, 760, 0.18, 'square', 0.07),
    land: () => noise(0.09, 0.22, 500),
    step: () => noise(0.035, 0.07, 900),
    mile: () => { tone(660, 660, 0.1, 'triangle', 0.12); tone(990, 990, 0.16, 'triangle', 0.12, 0.1); },
    crash: () => { noise(0.5, 0.35, 1400); tone(240, 50, 0.5, 'sawtooth', 0.14); }
  };

  function reset() {
    speed = START * K; dist = 0; obstacles = []; gapLeft = 500;
    player.y = GROUND; player.vy = 0; lastStep = 0; lastMile = 0; state = 'running'; sfx.start();
  }
  function gameOver(name) {
    state = 'over'; hit = name; overAt = performance.now(); sfx.crash();
    if (score() > best) {
      best = score();
      try { localStorage.setItem('bushRunnerBest', best); } catch (e) {}
    }
  }
  function act() {
    audio();
    if (state === 'ready') reset();
    else if (state === 'over') { if (performance.now() - overAt > 400) reset(); }
    else if (player.y >= GROUND) { player.vy = -JUMP; sfx.jump(); }
  }
  window.addEventListener('keydown', e => {
    if (e.code === 'KeyM') { setMuted(!muted); return; }
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) act(); }
  });
  document.addEventListener('pointerdown', act);

  function spawn() {
    const t = TYPES[Math.floor(Math.random() * TYPES.length)];
    obstacles.push({ ...t, x: W + 40 });
    gapLeft = t.w + speed * (0.85 + Math.random() * 0.85);
  }

  function update(dt) {
    if (state !== 'running') { if (state === 'ready') off += 40 * dt; return; }
    speed = Math.min(MAXV * K, speed + ACCEL * K * dt);
    dist += speed / K * dt; off += speed * dt;
    const wasAir = player.y < GROUND;
    player.vy += GRAV * dt; player.y += player.vy * dt;
    if (player.y >= GROUND) { player.y = GROUND; player.vy = 0; if (wasAir) sfx.land(); }
    const step = Math.floor(dist / 22 / Math.PI);
    if (step !== lastStep) { lastStep = step; if (player.y >= GROUND) sfx.step(); }
    const mile = Math.floor(score() / 100);
    if (mile > lastMile) { lastMile = mile; sfx.mile(); }
    gapLeft -= speed * dt;
    if (gapLeft <= 0) spawn();
    obstacles.forEach(o => o.x -= speed * dt);
    obstacles = obstacles.filter(o => o.x + o.w > -20);
    const p = { l: player.x + 7, r: player.x + player.w - 7, t: player.y - player.h + 8, b: player.y };
    for (const o of obstacles) {
      const b = { l: o.x + 6, r: o.x + o.w - 6, t: GROUND - o.h + 6, b: GROUND };
      if (p.r > b.l && p.l < b.r && p.b > b.t && p.t < b.b) { gameOver(o.n); break; }
    }
  }

  function tile(items, period, f, fn) {
    const o = (off * f) % period;
    for (const it of items) for (let k = 0; k <= 2; k++) {
      const x = it.x - o + k * period;
      if (x > -120 && x < W + 120) fn(it, x);
    }
  }

  function drawScene() {
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
    const sx = W * 0.78, sy = Math.max(92, GROUND * 0.25);
    const glow = ctx.createRadialGradient(sx, sy, 8, sx, sy, 200);
    glow.addColorStop(0, 'rgba(255,246,200,.95)'); glow.addColorStop(0.3, 'rgba(255,232,150,.4)'); glow.addColorStop(1, 'rgba(255,232,150,0)');
    ctx.fillStyle = glow; ctx.fillRect(sx - 200, sy - 200, 400, 400);
    ctx.fillStyle = '#fffbe0'; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, 7); ctx.fill();

    tile(clouds, 1500, .03, (c, x) => {
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      [[0, 0, 1], [-30, 7, .7], [32, 8, .75], [58, 13, .5]].forEach(([dx, dy, r]) => {
        ctx.beginPath(); ctx.ellipse(x + dx * c.s, GROUND * c.fy + dy, (34 * r + 10) * c.s, (15 * r + 6) * c.s, 0, 0, 7); ctx.fill();
      });
    });

    const hills = (base, amp, f, col) => {
      const o = off * f;
      ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, GROUND);
      for (let x = 0; x <= W; x += 12) {
        const u = x + o + base * 7;
        ctx.lineTo(x, base + amp * Math.sin(u / 140) + amp * .6 * Math.sin(u / 53));
      }
      ctx.lineTo(W, GROUND); ctx.fill();
    };
    hills(GROUND - 150, 24, .04, '#a9cfae');
    hills(GROUND - 115, 22, .08, '#86b884');
    hills(GROUND - 80, 16, .14, '#5f9c5c');

    tile(trees, 1560, .18, (t, x) => {
      const by = GROUND - 22;
      ctx.strokeStyle = '#4a3a2a'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x + 3, by - t.h); ctx.stroke();
      ctx.fillStyle = '#4f7a35'; ctx.beginPath(); ctx.ellipse(x + 3, by - t.h + 4, 66, 14, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#7fa84a'; ctx.beginPath(); ctx.ellipse(x + 3, by - t.h - 2, 62, 12, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x - 18, by - t.h - 12, 34, 9, 0, 0, 7); ctx.fill();
    });
    tile(bushes, 1215, .38, (b, x) => {
      [[0, 0, 1], [-b.r * .8, 6, .75], [b.r * .8, 6, .8]].forEach(([dx, dy, k]) => {
        ctx.fillStyle = b.c; ctx.beginPath(); ctx.arc(x + dx, GROUND - b.r * k + dy, b.r * k, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.beginPath(); ctx.arc(x + dx - b.r * k * .25, GROUND - b.r * k * 1.25 + dy, b.r * k * .55, 0, 7); ctx.fill();
      });
      ctx.fillStyle = b.f;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(x - b.r * .5 + i * b.r * .5, GROUND - b.r * (1.1 + (i % 2) * .3), 3, 0, 7); ctx.fill(); }
    });

    const dg = ctx.createLinearGradient(0, GROUND, 0, H); dg.addColorStop(0, '#c2925a'); dg.addColorStop(1, '#8a5f33');
    ctx.fillStyle = dg; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = '#4d9a35'; ctx.fillRect(0, GROUND, W, 14);
    ctx.fillStyle = '#2f6e25'; ctx.fillRect(0, GROUND + 14, W, 3);
    ctx.fillStyle = '#6dbb45';
    for (let x = -(off % 40); x < W; x += 40) {
      ctx.beginPath(); ctx.moveTo(x, GROUND + 4); ctx.lineTo(x + 5, GROUND - 10); ctx.lineTo(x + 10, GROUND + 4);
      ctx.lineTo(x + 15, GROUND - 7); ctx.lineTo(x + 20, GROUND + 4); ctx.fill();
    }
    ctx.fillStyle = '#7d5530';
    tile(pebbles, 1250, 1, (p, x) => { ctx.beginPath(); ctx.arc(x, GROUND + p.fy * (H - GROUND), p.r, 0, 7); ctx.fill(); });
  }

  function drawObstacle(o) {
    const { x, w, h } = o, y = GROUND - h;
    const poly = (pts, fill) => {
      ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b)); ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
    };
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(x + w / 2, GROUND + 4, w * .6, 6, 0, 0, 7); ctx.fill();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 3; ctx.strokeStyle = '#2a1a0e';
    if (o.n === 'log') {
      ctx.fillStyle = '#9b6a3a'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#b98550'; ctx.beginPath(); ctx.roundRect(x + 5, y + 4, w - 22, 7, 4); ctx.fill();
      ctx.fillStyle = '#e8c48a'; ctx.beginPath(); ctx.ellipse(x + w - 9, y + h / 2, 9, h / 2 - 2, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.lineWidth = 1.5; ctx.beginPath(); ctx.ellipse(x + w - 9, y + h / 2, 4, h / 2 - 9, 0, 0, 7); ctx.stroke();
      ctx.lineWidth = 2;
      [[10, .6], [24, .72], [38, .56]].forEach(([d, f]) => { ctx.beginPath(); ctx.moveTo(x + d, y + h * f); ctx.lineTo(x + d + 9, y + h * f); ctx.stroke(); });
    } else if (o.n === 'rock') {
      poly([[x, GROUND], [x + 4, y + 16], [x + 18, y + 2], [x + 34, y], [x + w - 2, y + 16], [x + w, GROUND]], '#9aa0a6'); ctx.stroke();
      poly([[x + 18, y + 2], [x + 34, y], [x + w - 2, y + 16], [x + 27, y + 21]], '#c9ced3');
      poly([[x, GROUND], [x + 4, y + 16], [x + 20, y + 24], [x + 16, GROUND]], '#6f757b');
      ctx.fillStyle = '#5aa845'; ctx.beginPath(); ctx.ellipse(x + 15, y + 9, 8, 3.5, -.3, 0, 7); ctx.fill();
    } else if (o.n === 'thorn bush') {
      ctx.fillStyle = '#2f6b2a'; ctx.beginPath(); ctx.ellipse(x + w / 2, GROUND - 21, w / 2, 21, 0, 0, 7); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#44913a'; ctx.beginPath(); ctx.ellipse(x + w / 2 - 7, GROUND - 28, 14, 8, -.3, 0, 7); ctx.fill();
      ctx.lineWidth = 1.5; ctx.fillStyle = '#fff3c0';
      for (let i = 0; i < 7; i++) {
        const sx = x + 6 + i * 7.5, sy = GROUND - 34 - Math.sin(i * 1.7) * 8;
        ctx.beginPath(); ctx.moveTo(sx - 3.5, sy + 8); ctx.lineTo(sx, sy - 11 + (i % 2) * 5); ctx.lineTo(sx + 3.5, sy + 8); ctx.closePath(); ctx.fill(); ctx.stroke();
      }
      ctx.fillStyle = '#e63946';
      [[.28, 22], [.55, 14], [.78, 24]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(x + w * a, GROUND - b, 3, 0, 7); ctx.fill(); });
    } else {
      poly([[x, GROUND], [x + 6, y + 22], [x + w * .35, y + 8], [x + w / 2, y], [x + w * .65, y + 8], [x + w - 6, y + 22], [x + w, GROUND]], '#c2703d'); ctx.stroke();
      poly([[x + w / 2, y], [x + w * .65, y + 8], [x + w - 6, y + 22], [x + w, GROUND], [x + w / 2 + 4, GROUND]], '#dc9055');
      ctx.fillStyle = '#5a2f17';
      [[.38, .5, 3, 5], [.62, .7, 3, 4], [.5, .3, 2.5, 4]].forEach(([a, b, rx, ry]) => { ctx.beginPath(); ctx.ellipse(x + w * a, y + h * b, rx, ry, 0, 0, 7); ctx.fill(); });
      ctx.strokeStyle = '#8a4a24'; ctx.lineWidth = 1.5;
      [[.3, .42], [.55, .58], [.35, .8]].forEach(([a, b]) => { ctx.beginPath(); ctx.moveTo(x + w * a - 6, y + h * b); ctx.lineTo(x + w * a + 6, y + h * b); ctx.stroke(); });
    }
  }

  function drawPlayer() {
    const p = player, air = p.y < GROUND, cx = p.x + p.w / 2, L = '#241a14', SK = '#8d5a3b';
    const ph = state === 'running' ? dist / 22 : 0;
    const bob = air ? 0 : Math.abs(Math.sin(ph)) * 2.5;
    const hipY = p.y - 25 - bob, lift = Math.min(1, (GROUND - p.y) / 120);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(cx, GROUND + 5, 20 - lift * 8, 5 - lift * 2, 0, 0, 7); ctx.fill();
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const limb = (pts, col, wd) => {
      ctx.beginPath(); pts.forEach(([a, b], i) => i ? ctx.lineTo(a, b) : ctx.moveTo(a, b));
      ctx.strokeStyle = L; ctx.lineWidth = wd + 3; ctx.stroke(); ctx.strokeStyle = col; ctx.lineWidth = wd; ctx.stroke();
    };
    const arm = (i, col) => {
      const s = air ? (i ? 1 : -.8) : Math.sin(ph + (i ? 0 : Math.PI));
      const sh = [cx + 2, p.y - 46 - bob], hand = [cx + 3 + s * 15, p.y - 34 - bob - (air ? 14 : 0)];
      limb([sh, [(sh[0] + hand[0]) / 2 + 2, (sh[1] + hand[1]) / 2 + 3], hand], col, 7);
      ctx.fillStyle = SK; ctx.beginPath(); ctx.arc(hand[0], hand[1], 4.5, 0, 7); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = L; ctx.stroke();
    };
    arm(0, '#0e8f80');
    ctx.fillStyle = '#f58a1f'; ctx.strokeStyle = L; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(cx - 24, p.y - 52 - bob, 15, 25, 5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffc266'; ctx.fillRect(cx - 22, p.y - 40 - bob, 11, 3);
    for (let i = 0; i < 2; i++) {
      const a = ph + i * Math.PI, s = air ? (i ? 1 : -.7) : Math.sin(a), up = air ? 12 : Math.max(0, Math.cos(a)) * 10;
      const fx = cx + s * 16, fy = p.y - up, kx = (cx + fx) / 2 + 5, ky = (hipY + fy) / 2 - 1;
      limb([[cx, hipY], [kx, ky], [fx, fy]], '#2f5fb3', 9);
      ctx.fillStyle = '#fff'; ctx.strokeStyle = L; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(fx - 6, fy - 6, 16, 8, 4); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#f2b73c'; ctx.fillRect(fx - 5, fy, 14, 2);
    }
    ctx.fillStyle = '#18b8a5'; ctx.strokeStyle = L; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(cx - 14, p.y - 53 - bob, 28, 31, 9); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.fillRect(cx - 12, p.y - 42 - bob, 24, 4);
    ctx.fillStyle = '#0e8f80'; ctx.beginPath(); ctx.roundRect(cx - 8, p.y - 33 - bob, 16, 8, 3); ctx.fill();
    arm(1, '#18b8a5');
    const hx = cx + 2, hy = p.y - 66 - bob;
    ctx.fillStyle = SK; ctx.strokeStyle = L; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(hx, hy, 12, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(hx + 6, hy - 1, 3.3, 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = L; ctx.beginPath(); ctx.arc(hx + 7, hy - 1, 1.8, 0, 7); ctx.fill();
    ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(hx + 5, hy + 4, 4, .2, 2.4); ctx.stroke();
    ctx.fillStyle = '#e63946'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(hx, hy - 2, 12.5, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(hx + 4, hy - 6, 17, 6, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(hx, hy - 10, 3, 0, 7); ctx.fill();
  }

  function drawHUD() {
    ctx.textBaseline = 'alphabetic';
    const x0 = 16 + inset.l, x1 = W - 16 - inset.r, y0 = 16 + inset.t;
    ctx.fillStyle = 'rgba(28,38,21,.55)'; ctx.beginPath(); ctx.roundRect(x0, y0, x1 - x0, 40, 10); ctx.fill();
    ctx.fillStyle = '#f4ecd0'; ctx.font = `700 20px ${FONT}`;
    ctx.textAlign = 'left'; ctx.fillText(`${score()} m`, x0 + 16, y0 + 27);
    ctx.textAlign = 'center'; ctx.fillText(`Speed ${(speed / (START * K)).toFixed(1)}x`, (x0 + x1) / 2, y0 + 27);
    ctx.textAlign = 'right'; ctx.fillText(`Best ${best} m`, x1 - 16, y0 + 27);
  }

  function overlay(title, lines) {
    ctx.fillStyle = 'rgba(28,38,21,.58)'; ctx.fillRect(0, 0, W, H);
    const cy = Math.round(GROUND * 0.51);
    ctx.textAlign = 'center'; ctx.fillStyle = '#f4ecd0';
    ctx.font = `700 ${Math.min(46, W * 0.07)}px ${FONT}`; ctx.fillText(title, W / 2, cy);
    ctx.font = `400 ${Math.min(21, W * 0.034)}px ${FONT}`;
    lines.forEach((l, i) => ctx.fillText(l, W / 2, cy + 42 + i * 32));
  }

  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight, portrait = vh > vw;
    const scale = Math.min(vw / (portrait ? 600 : 900), vh / 400);
    const onGround = player.y >= GROUND;
    W = vw / scale; H = vh / scale; K = Math.min(1, W / 900);
    GROUND = Math.round(H * (portrait ? 0.68 : 0.82));
    const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2, 2400 / Math.max(vw, vh)));
    cv.style.width = vw + 'px'; cv.style.height = vh + 'px';
    cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
    const cs = getComputedStyle(safeEl), px = v => (parseFloat(v) || 0) / scale;
    inset = { t: px(cs.paddingTop), r: px(cs.paddingRight), b: px(cs.paddingBottom), l: px(cs.paddingLeft) };
    player.x = Math.max(70, Math.min(140, W * 0.13));
    if (onGround) player.y = GROUND;
    speed = state === 'running' ? Math.min(speed, MAXV * K) : START * K;
    sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, '#3d82b8'); sky.addColorStop(0.55, '#9fd0de'); sky.addColorStop(1, '#ffe0a0');
  }

  fit(); window.addEventListener('resize', fit);
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt);
    drawScene(); obstacles.forEach(drawObstacle); drawPlayer(); drawHUD();
    if (state === 'ready') overlay('Bush Runner', ['Jump over logs, rocks, thorns and termite mounds.', 'Tap or press Space to start']);
    if (state === 'over') overlay(`You hit a ${hit}`, [`Distance ${score()} m  ·  Best ${best} m`, 'Tap or press Space to run again']);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.ready.then(() => { const t = document.getElementById('offline'); t.hidden = false; setTimeout(() => { t.hidden = true; }, 3500); });
  });
}
</script>
